<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KoKoa | Chat</title>
  <link rel="stylesheet" href="styles/common.css" />
  <link rel="stylesheet" href="styles/chat.css" />
</head>
<body>
<div class="screen chat-screen">

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-bar__left">
      No Service
      <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
    </div>
    <span class="status-bar__time">21:28</span>
    <div class="status-bar__right">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      100%
      <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </div>
  </div>

  <!-- Chat Header: < Name  [search] [≡] -->
  <div class="chat-header">
    <a href="chats.html" class="chat-header__back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <div class="chat-header__name">김지수</div>
    <div class="chat-header__actions">
      <div class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
        </svg>
      </div>
      <!-- hamburger menu -->
      <div class="icon-btn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="5" width="18" height="2" rx="1"/>
          <rect x="3" y="11" width="18" height="2" rx="1"/>
          <rect x="3" y="17" width="18" height="2" rx="1"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div class="page-content">
    <div class="chat-messages">

      <div class="chat-date"><span>Tuesday, June 30, 2020</span></div>

      <!-- Received -->
      <div class="msg-row msg-row--received">
        <div class="msg-avatar" style="background:#7B9BC8;">지</div>
        <div class="msg-col">
          <div class="msg-sender">김지수</div>
          <div class="msg-bubble-row">
            <div class="msg-bubble msg-bubble--received">안녕! 오늘 스터디 자료 준비 다 됐어?</div>
            <div class="msg-time">21:27</div>
          </div>
        </div>
      </div>

      <!-- Sent -->
      <div class="msg-row msg-row--sent">
        <div class="msg-col">
          <div class="msg-bubble-row">
            <div class="msg-time">21:27</div>
            <div class="msg-bubble msg-bubble--sent">거의 다 됐어 ㅎ 마지막 슬라이드만!</div>
          </div>
        </div>
      </div>

      <!-- Received -->
      <div class="msg-row msg-row--received">
        <div class="msg-avatar" style="background:#7B9BC8;opacity:0;">지</div>
        <div class="msg-col">
          <div class="msg-bubble-row">
            <div class="msg-bubble msg-bubble--received">ㅋㅋ 화이팅!! 🔥</div>
            <div class="msg-time">21:28</div>
          </div>
        </div>
      </div>

      <!-- Sent -->
      <div class="msg-row msg-row--sent">
        <div class="msg-col">
          <div class="msg-bubble-row">
            <div class="msg-time">21:28</div>
            <div class="msg-bubble msg-bubble--sent">What's up?</div>
          </div>
        </div>
      </div>

      <div style="height:80px;"></div>

    </div>
  </div>

  <!-- Input Bar: [+] [pill: Hi! + emoji] [yellow ↑] -->
  <div class="chat-input-bar">
    <div class="chat-input-bar__plus">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </div>
    <div class="chat-input-bar__pill">
      <input type="text" placeholder="메시지를 입력하세요" value="Hi!" />
      <div class="chat-input-bar__emoji">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
          <line x1="9" y1="9" x2="9.01" y2="9"/>
          <line x1="15" y1="9" x2="15.01" y2="9"/>
        </svg>
      </div>
    </div>
    <div class="chat-input-bar__send">
      <!-- up arrow -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#3B1D1D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5 12 12 5 19 12"/>
      </svg>
    </div>
  </div>

</div>
</body>
</html>
