<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KoKoa | More</title>
  <link rel="stylesheet" href="styles/common.css" />
  <link rel="stylesheet" href="styles/more.css" />
</head>
<body>
<div class="screen">

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-bar__left">
      No Service
      <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
    </div>
    <span class="status-bar__time">21:23</span>
    <div class="status-bar__right">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      100%
      <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </div>
  </div>

  <!-- Header: "More" + search + music + settings(dot) -->
  <div class="page-header">
    <span class="page-header__title">More</span>
    <div class="page-header__actions">
      <div class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
        </svg>
      </div>
      <div class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <a href="settings.html" class="icon-btn" style="position:relative;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span style="position:absolute;top:0;right:0;width:6px;height:6px;background:var(--red);border-radius:50%;"></span>
      </a>
    </div>
  </div>

  <div class="page-content">

    <!-- Profile row -->
    <div class="more-profile">
      <div class="avatar avatar--xl" style="background:#7B9BC8;color:white;font-size:26px;">R</div>
      <div class="more-profile__info">
        <div class="more-profile__name">Ryan Ku</div>
        <div class="more-profile__phone">
          +44 7700-900-123
          <svg viewBox="0 0 24 24" fill="var(--red)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        </div>
      </div>
      <div class="more-profile__chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="3" width="20" height="15" rx="2"/>
          <line x1="8" y1="10" x2="16" y2="10"/>
          <line x1="8" y1="14" x2="12" y2="14"/>
        </svg>
      </div>
    </div>

    <!-- Icon grid row 1: Calendar | Talk Drive(dot) | Emoticons | Themes -->
    <div class="more-grid">
      <div class="more-grid-item">
        <div class="more-grid-item__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            <polyline points="9 16 11 18 15 14"/>
          </svg>
        </div>
        <span class="more-grid-item__label">Calendar</span>
      </div>
      <div class="more-grid-item">
        <div class="more-grid-item__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/>
          </svg>
          <span class="more-grid-item__dot"></span>
        </div>
        <span class="more-grid-item__label">Talk Drive</span>
      </div>
      <div class="more-grid-item">
        <div class="more-grid-item__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
            <line x1="9" y1="9" x2="9.01" y2="9" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="15" y1="9" x2="15.01" y2="9" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="more-grid-item__label">Emoticons</span>
      </div>
      <div class="more-grid-item">
        <div class="more-grid-item__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
          </svg>
        </div>
        <span class="more-grid-item__label">Themes</span>
      </div>
    </div>

    <!-- Icon grid row 2: Account | Openchat (only 2 items, left-aligned) -->
    <div class="more-grid" style="grid-template-columns:repeat(4,1fr);">
      <div class="more-grid-item">
        <div class="more-grid-item__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
            <circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
            <line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/>
          </svg>
        </div>
        <span class="more-grid-item__label">Account</span>
      </div>
      <div class="more-grid-item">
        <div class="more-grid-item__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <span class="more-grid-item__label">Openchat</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Suggestions -->
    <div class="suggestions-section" style="padding:16px 18px;">
      <div class="suggestions-label">Suggestions</div>
      <div class="suggestions-list">
        <div class="suggestion-item">
          <div class="suggestion-item__icon" style="background:#1A1A1A;">
            <!-- Kakao Story: yellow quotation mark on black -->
            <span style="font-size:28px;color:#FEE500;">"</span>
          </div>
          <span class="suggestion-item__label">Kakao Story</span>
        </div>
        <div class="suggestion-item">
          <div class="suggestion-item__icon" style="background:var(--yellow);">
            <!-- kakao friends: bear face emoji style -->
            <span style="font-size:30px;">🐻</span>
          </div>
          <span class="suggestion-item__label">kakao friends</span>
        </div>
        <div class="suggestion-item">
          <div class="suggestion-item__icon" style="background:#3A8A3A;">
            <span style="font-size:30px;">💎</span>
          </div>
          <span class="suggestion-item__label">Friends Gem</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Nav Bar -->
  <nav class="nav">
    <a href="friends.html" class="nav__item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
    </a>
    <a href="chats.html" class="nav__item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </a>
    <a href="find.html" class="nav__item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
      </svg>
    </a>
    <a href="more.html" class="nav__item active">
      <div style="position:relative;display:inline-flex;">
        <svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26">
          <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
        </svg>
        <span class="nav__dot"></span>
      </div>
    </a>
  </nav>

</div>
</body>
</html>
