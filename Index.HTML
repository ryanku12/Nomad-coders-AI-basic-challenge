<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KoKoa</title>
  <link rel="stylesheet" href="styles/common.css" />
  <link rel="stylesheet" href="styles/index.css" />
</head>
<body>

<!-- ══ SPLASH SCREEN (shown briefly, then fades to login) ══ -->
<div class="screen splash" id="splash">
  <svg class="splash__icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Speech bubble icon: dark ellipse with tail, matching reference 01.png -->
    <ellipse cx="48" cy="46" rx="32" ry="26" fill="#3B1D1D"/>
    <polygon points="38,68 44,58 52,58" fill="#3B1D1D"/>
  </svg>
</div>

<!-- ══ LOGIN PAGE ══ -->
<div class="screen login-page" id="loginPage" style="display:none;">

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-bar__left">
      No Service
      <!-- wifi icon -->
      <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
    </div>
    <span class="status-bar__time">18:43</span>
    <div class="status-bar__right">
      <!-- lock icon -->
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      11%
      <!-- battery -->
      <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </div>
  </div>

  <div class="login-body">
    <h1 class="login-title">Welcome to KakaoTalk</h1>
    <p class="login-subtitle">If you have a Kakao Account,<br>log in with your email or phone number.</p>

    <input class="login-input" type="email" placeholder="Email or phone number" />
    <input class="login-input" type="password" placeholder="Password" />

    <div class="login-gap"></div>

    <a href="friends.html"><button class="login-btn">Log In</button></a>
    <button class="login-btn">Sign Up</button>

    <div class="login-find">Find Kakao Account or Password</div>
  </div>

</div>

<script>
  // Show splash for 1.5s then show login
  setTimeout(() => {
    document.getElementById('splash').style.display = 'none';
    document.getElementById('loginPage').style.display = 'flex';
  }, 1500);
</script>

</body>
</html>
